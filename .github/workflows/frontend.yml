name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Richmond-Rivera.html'
      - 'Richmond-Rivera.css'
      - 'Richmond-Rivera.js'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_BUCKET_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 cp Richmond-Rivera.html s3://${{ secrets.S3_BUCKET_NAME }}/Richmond-Rivera.html
          aws s3 cp Richmond-Rivera.css s3://${{ secrets.S3_BUCKET_NAME }}/Richmond-Rivera.css
          aws s3 cp Richmond-Rivera.js s3://${{ secrets.S3_BUCKET_NAME }}/Richmond-Rivera.js

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"